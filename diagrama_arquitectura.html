<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arquitectura Cloud INEGI</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); padding: 40px 48px; max-width: 820px; width: 100%; }
  h1 { text-align: center; color: #1F4E79; font-size: 22px; margin-bottom: 4px; }
  p.sub { text-align: center; color: #595959; font-size: 13px; margin-bottom: 32px; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Arquitectura Cloud — DENUE INEGI</h1>
  <p class="sub">Cecilia Ruiz · ceciliaruiz.pythonanywhere.com · 2026</p>
  <svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- Excel -->
    <rect x="20" y="170" width="130" height="64" rx="10" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
    <text x="85" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Excel INEGI</text>
    <text x="85" y="214" text-anchor="middle" font-size="11" fill="#388E3C">21,093 registros</text>
    <text x="85" y="228" text-anchor="middle" font-size="11" fill="#388E3C">DENUE Agropecuario</text>

    <!-- Supabase -->
    <rect x="210" y="80" width="150" height="64" rx="10" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
    <text x="285" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#00695C">Supabase</text>
    <text x="285" y="124" text-anchor="middle" font-size="11" fill="#00796B">PostgreSQL</text>
    <text x="285" y="138" text-anchor="middle" font-size="11" fill="#00796B">6 tablas relacionales</text>

    <!-- Flask API -->
    <rect x="210" y="240" width="150" height="64" rx="10" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5"/>
    <text x="285" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A1B9A">Flask API</text>
    <text x="285" y="284" text-anchor="middle" font-size="11" fill="#7B1FA2">Python · 7 endpoints</text>
    <text x="285" y="298" text-anchor="middle" font-size="11" fill="#7B1FA2">Respuesta JSON</text>

    <!-- PythonAnywhere -->
    <rect x="430" y="160" width="160" height="64" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
    <text x="510" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">PythonAnywhere</text>
    <text x="510" y="204" text-anchor="middle" font-size="11" fill="#EF6C00">Hosting gratuito</text>
    <text x="510" y="218" text-anchor="middle" font-size="11" fill="#EF6C00">ceciliaruiz.pythonanywhere.com</text>

    <!-- Postman -->
    <rect x="440" y="50" width="130" height="54" rx="10" fill="#FBE9E7" stroke="#E64A19" stroke-width="1.5"/>
    <text x="505" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">Postman</text>
    <text x="505" y="91" text-anchor="middle" font-size="11" fill="#D84315">Validación API</text>

    <!-- Looker Studio -->
    <rect x="440" y="300" width="150" height="64" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
    <text x="515" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">Looker Studio</text>
    <text x="515" y="344" text-anchor="middle" font-size="11" fill="#1565C0">Dashboard BI</text>
    <text x="515" y="358" text-anchor="middle" font-size="11" fill="#1565C0">KPIs + Visualizaciones</text>

    <!-- GitHub -->
    <rect x="210" y="360" width="150" height="48" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5"/>
    <text x="285" y="381" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">GitHub</text>
    <text x="285" y="398" text-anchor="middle" font-size="11" fill="#6A1B9A">Repositorio del código</text>

    <!-- FLECHAS -->
    <!-- Excel -> Supabase -->
    <line x1="150" y1="185" x2="210" y2="130" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="172" y="150" text-anchor="middle" font-size="10" fill="#555">CSV</text>

    <!-- Excel -> Flask -->
    <line x1="150" y1="207" x2="210" y2="265" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>

    <!-- Supabase -> Flask -->
    <line x1="285" y1="144" x2="285" y2="240" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="298" y="196" text-anchor="start" font-size="10" fill="#555">SQL</text>

    <!-- Flask -> PythonAnywhere -->
    <line x1="360" y1="265" x2="430" y2="210" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="400" y="248" text-anchor="middle" font-size="10" fill="#555">deploy</text>

    <!-- PythonAnywhere -> Postman -->
    <line x1="500" y1="160" x2="496" y2="104" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>

    <!-- PythonAnywhere -> Looker -->
    <line x1="510" y1="224" x2="510" y2="300" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>
    <text x="526" y="266" text-anchor="start" font-size="10" fill="#555">JSON</text>

    <!-- Flask -> GitHub -->
    <line x1="285" y1="304" x2="285" y2="360" stroke="#888" stroke-width="1.3" marker-end="url(#arr)"/>

  </svg>
</div>
</body>
</html>
